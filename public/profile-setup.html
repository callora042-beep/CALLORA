<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callora — Set up your profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #8B7CFF; --blue: #4F8CFF; --bg-dark: #0E0B1F;
    --card-dark: #171330; --border-dark: #2A2450; --muted: #9C96C4;
    --gradient: linear-gradient(135deg, var(--violet), var(--blue));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: white;
    min-height: 100vh; display: flex; justify-content: center; padding: 50px 20px;
  }
  .wrap { width: 100%; max-width: 380px; }
  .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
  .brand-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gradient); }
  .brand-row span { font-weight: 700; font-size: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .input {
    width: 100%; background: var(--card-dark); border: 1px solid var(--border-dark);
    border-radius: 12px; padding: 14px; font-size: 13px; color: white;
    margin-bottom: 16px; font-family: 'Poppins', sans-serif;
  }
  .input::placeholder { color: var(--muted); }
  select.input { appearance: none; }
  .role-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .role-chip {
    flex: 1; text-align: center; padding: 12px; border-radius: 12px;
    border: 1px solid var(--border-dark); font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .role-chip.selected { background: var(--gradient); color: white; border-color: transparent; }
  .btn {
    background: var(--gradient); color: white; text-align: center; padding: 14px;
    border-radius: 12px; font-size: 14px; font-weight: 600; margin-top: 8px;
    border: none; width: 100%; cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #FF9C9C; font-size: 12px; text-align: center; margin-top: 12px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand-row"><div class="dot"></div><span>Callora</span></div>
  <h1>Set up your profile</h1>
  <div class="sub">Just a few details before you get started.</div>

  <div class="field-label">Your name</div>
  <input class="input" id="name" type="text" placeholder="e.g. Amara O.">

  <div class="field-label">Phone number</div>
  <input class="input" id="phone" type="tel" placeholder="+234...">

  <div class="field-label">I want to...</div>
  <div class="role-row">
    <div class="role-chip selected" data-role="caller" onclick="selectRole('caller')">Just call people</div>
    <div class="role-chip" data-role="provider" onclick="selectRole('provider')">Take calls</div>
    <div class="role-chip" data-role="both" onclick="selectRole('both')">Both</div>
  </div>

  <button class="btn" id="submitBtn" onclick="saveProfile()">Continue</button>
  <div class="error" id="errorMsg"></div>
</div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  let currentUser = null;
  let selectedRole = 'caller';

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = user;
  });

  window.selectRole = (role) => {
    selectedRole = role;
    document.querySelectorAll('.role-chip').forEach(chip => {
      chip.classList.toggle('selected', chip.dataset.role === role);
    });
  };

  window.saveProfile = async () => {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const errorEl = document.getElementById('errorMsg');
    const btn = document.getElementById('submitBtn');
    errorEl.classList.remove('show');

    if (!name || !phone) {
      errorEl.textContent = 'Name and phone number are required';
      errorEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      await updateDoc(doc(db, 'users', currentUser.uid), {
        name,
        phone,
        role: selectedRole,
      });
      window.location.href = 'home.html';
    } catch (err) {
      errorEl.textContent = 'Could not save your profile — try again.';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  };
</script>

</body>
</html>
