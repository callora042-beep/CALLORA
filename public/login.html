<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callora — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #8B7CFF; --blue: #4F8CFF; --bg-dark: #0E0B1F;
    --card-dark: #171330; --border-dark: #2A2450; --muted: #9C96C4;
    --gradient: linear-gradient(135deg, var(--violet), var(--blue));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: white;
    min-height: 100vh; display: flex; justify-content: center; padding: 60px 20px;
  }
  .wrap { width: 100%; max-width: 380px; }
  .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; justify-content: center; }
  .brand-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gradient); }
  .brand-row span { font-weight: 700; font-size: 18px; }
  h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 28px; }
  .input {
    width: 100%; background: var(--card-dark); border: 1px solid var(--border-dark);
    border-radius: 12px; padding: 14px; font-size: 13px; color: white;
    margin-bottom: 12px; font-family: 'Poppins', sans-serif;
  }
  .input::placeholder { color: var(--muted); }
  .btn {
    background: var(--gradient); color: white; text-align: center; padding: 14px;
    border-radius: 12px; font-size: 14px; font-weight: 600; margin-top: 8px;
    border: none; width: 100%; cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-row { text-align: center; margin-top: 18px; font-size: 12px; color: var(--muted); }
  .link-row a { color: var(--blue); cursor: pointer; text-decoration: none; }
  .error { color: #FF9C9C; font-size: 12px; text-align: center; margin-top: 12px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand-row"><div class="dot"></div><span>Callora</span></div>
  <h1 id="formTitle">Welcome back</h1>
  <div class="sub">Your time. Your conversation.</div>

  <input class="input" id="email" type="email" placeholder="Email address" autocomplete="email">
  <input class="input" id="password" type="password" placeholder="Password" autocomplete="current-password">

  <button class="btn" id="submitBtn" onclick="handleSubmit()">Log in</button>
  <div class="error" id="errorMsg"></div>

  <div class="link-row" id="toggleRow">New here? <a onclick="toggleMode()">Create an account</a></div>
</div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  let isSignup = false;

  window.toggleMode = () => {
    isSignup = !isSignup;
    document.getElementById('formTitle').textContent = isSignup ? 'Create your account' : 'Welcome back';
    document.getElementById('submitBtn').textContent = isSignup ? 'Sign up' : 'Log in';
    document.getElementById('toggleRow').innerHTML = isSignup
      ? 'Already have an account? <a onclick="toggleMode()">Log in</a>'
      : 'New here? <a onclick="toggleMode()">Create an account</a>';
    document.getElementById('errorMsg').classList.remove('show');
  };

  window.handleSubmit = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('errorMsg');
    const btn = document.getElementById('submitBtn');
    errorEl.classList.remove('show');

    if (!email || !password) {
      errorEl.textContent = 'Enter both email and password';
      errorEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = isSignup ? 'Creating account...' : 'Logging in...';

    try {
      if (isSignup) {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, 'users', cred.user.uid), {
          email,
          name: '',
          role: 'caller',
          phone: '',
          cloneVoiceId: null,
          callAssistMode: 'assist',
          createdAt: serverTimestamp(),
        });
        window.location.href = 'profile-setup.html';
      } else {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'home.html';
      }
    } catch (err) {
      errorEl.textContent = friendlyError(err.code);
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = isSignup ? 'Sign up' : 'Log in';
    }
  };

  function friendlyError(code) {
    const map = {
      'auth/email-already-in-use': 'That email is already registered — try logging in instead.',
      'auth/invalid-email': 'That email address doesn\'t look right.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/invalid-credential': 'Incorrect email or password.',
    };
    return map[code] || 'Something went wrong — try again.';
  }
</script>

</body>
  </html>
